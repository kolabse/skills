name: Validate skills

permissions:
  contents: read

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Validate collection
        run: python scripts/validate_skills.py
      - name: Prepare blind trigger suite
        run: python scripts/trigger_evals.py prepare --output .trigger-evals/suite.json
      - name: Prepare locked release holdout
        run: python scripts/trigger_evals.py prepare --corpus release-holdout --output .trigger-evals/release-holdout.json
      - name: Reject changes to published holdout versions
        if: github.event_name == 'pull_request' && matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
        run: git diff --diff-filter=MD --exit-code "${{ github.event.pull_request.base.sha }}" -- 'evals/release-holdout-v*.json' 'evals/baselines/*.json'
      - name: Run unit tests
        run: python -m unittest discover -s tests -v

  skills-cli-discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DISABLE_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Verify skills CLI discovery
        run: npx --yes skills@1.5.22 add . --list
      - name: Smoke-test copied installation
        run: python scripts/smoke_install.py
