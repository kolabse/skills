name: Release artifacts

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build or backfill
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Check out release automation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: automation
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          fetch-depth: 0
          path: source
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Verify immutable release source
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]; then
            echo "Unsupported release tag: $RELEASE_TAG" >&2
            exit 1
          fi
          test "$(git -C source cat-file -t "refs/tags/$RELEASE_TAG")" = "tag"
          test "$(git -C source rev-parse HEAD)" = "$(git -C source rev-list -n 1 "$RELEASE_TAG")"
      - name: Build deterministic release artifacts
        run: >-
          python automation/scripts/build_release.py
          --source source
          --tag "$RELEASE_TAG"
          --output dist
      - name: Verify release checksums
        run: python automation/scripts/build_release.py --verify dist/SHA256SUMS
      - name: Attest release artifacts
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |-
            dist/*.zip
            dist/*.tar.gz
            dist/release-manifest.json
            dist/SHA256SUMS
      - name: Create release when needed and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes --title "kolabse skills $RELEASE_TAG"
          fi
          mkdir -p published
          for asset in dist/*; do
            name="$(basename "$asset")"
            if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -Fxq "$name"; then
              gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern "$name" --dir published
              cmp "$asset" "published/$name" || {
                echo "Published asset differs and will not be overwritten: $name" >&2
                exit 1
              }
              echo "Verified existing release asset: $name"
            else
              gh release upload "$RELEASE_TAG" "$asset" --repo "$GITHUB_REPOSITORY"
            fi
          done
