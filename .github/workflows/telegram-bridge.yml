name: Telegram bridge prototype
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  windows-prototype:
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Offline lifecycle and MCP protocol checks
        run: python prototypes/telegram_task_bridge/run_checks.py
